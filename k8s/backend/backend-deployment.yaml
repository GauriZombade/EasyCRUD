apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: backend-deployment
  labels: 
    app: backend 
spec: 
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: 
      maxSurge: 1
      maxUnavailable: 0
  selector: 
    matchLabels: 
      app: backend 
  template: 
    metadata: 
      labels: 
        app: backend 
    spec: 
      containers: 
      - name: nginx-cont
        image: 525382241025.dkr.ecr.us-west-2.amazonaws.com/backend:29
        ports:
          - containerPort: 8080
        
        resources:
          requests: 
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"